name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsodium-dev libcli11-dev

      - name: Build
        run: make

      - name: Build with warnings as errors
        run: |
          make clean
          make CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Werror"

      - name: Check CLI
        run: ./cryptor --help
